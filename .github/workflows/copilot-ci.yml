name: copilot-ci

on:
  push:
    paths: ["copilot/**", ".github/workflows/copilot-ci.yml"]
  pull_request:
    paths: ["copilot/**", ".github/workflows/copilot-ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: copilot/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: copilot/extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: copilot/extension/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
